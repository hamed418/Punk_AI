name: Deploy Landing V4

on:
  push:
    branches: [main]
    paths:
      - 'landing-v4/**'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_LANDING }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit landing-v4 build to Cloud Build
        run: |
          gcloud builds submit ./landing-v4 \
            --config=landing-v4/cloudbuild.yaml \
            --project=<GCP_PROJECT> \
            --region=northamerica-northeast1 \
            --gcs-source-staging-dir=gs://<GCP_PROJECT>-landing-build-source/source \
            --substitutions=COMMIT_SHA=${{ github.sha }} \
            --timeout=15m