services:

  app:
    build: .
    container_name: punk_ai
    ports:
      - "${APP_PORT}:${APP_PORT}"
    # depends_on:
    #   db:
    #     condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - APP_PORT=${APP_PORT}
    restart: unless-stopped
    volumes:
      - .:/app
      - ./uploads:/app/uploads

  worker:
    build: .
    container_name: punk_ai_worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - .:/app
    command: [ "arq", "app.worker.WorkerSettings" ]
