[pytest]
# Evals hit real Gemini, are non-deterministic, and cost API $ — they must
# NOT run per-commit. `addopts` deselects them by default; opt in explicitly
# with `pytest -m eval` (the trailing CLI -m overrides this one).
addopts = -m "not eval"
markers =
    eval: real-LLM accuracy eval — gated, run with `pytest -m eval`
